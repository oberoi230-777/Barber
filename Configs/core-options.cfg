# Core Options Configuration
# Per-emulator settings for optimal performance

# ================================
# FCEUmm (NES)
# ================================
fceumm_turbo_enable = "Both"
fceumm_aspect = "8:7 PAR"
fceumm_overscan_h = "enabled"
fceumm_overscan_v = "enabled"
fceumm_palette = "default"

# ================================
# Snes9x (SNES)
# ================================
snes9x_region = "auto"
snes9x_aspect = "4:3"
snes9x_overscan = "enabled"
snes9x_gfx_hires = "enabled"
snes9x_audio_interpolation = "gaussian"
snes9x_block_invalid_vram_access = "true"

# ================================
# Mupen64Plus (N64)
# ================================
mupen64plus-rdp-plugin = "gliden64"
mupen64plus-43screensize = "640x480"
mupen64plus-aspect = "4:3"
mupen64plus-BilinearMode = "standard"
mupen64plus-EnableCopyColorToRDRAM = "Async"
mupen64plus-EnableFBEmulation = "True"
mupen64plus-EnableTextureCache = "True"

# ================================
# Gambatte (Game Boy / GBC)
# ================================
gambatte_gb_colorization = "auto"
gambatte_gb_internal_palette = "GB - DMG"
gambatte_gbc_color_correction = "GBC only"
gambatte_gbc_frontcolor = "White"

# ================================
# mGBA (Game Boy Advance)
# ================================
mgba_sgb_borders = "ON"
mgba_gb_colors = "Grayscale"
mgba_use_bios = "ON"
mgba_solar_sensor_level = "0"
mgba_idle_optimization = "Remove Known"

# ================================
# Genesis Plus GX (Genesis/SMS/GG)
# ================================
genesis_plus_gx_system_hw = "auto"
genesis_plus_gx_region_detect = "auto"
genesis_plus_gx_aspect_ratio = "auto"
genesis_plus_gx_render = "single field"
genesis_plus_gx_gun_cursor = "disabled"
genesis_plus_gx_overscan = "disabled"
genesis_plus_gx_ym2413 = "auto"

# ================================
# PCSX ReARMed (PlayStation 1)
# ================================
pcsx_rearmed_frameskip = "0"
pcsx_rearmed_dithering = "enabled"
pcsx_rearmed_duping_enable = "enabled"
pcsx_rearmed_region = "auto"
pcsx_rearmed_multitap1 = "disabled"
pcsx_rearmed_multitap2 = "disabled"
pcsx_rearmed_show_bios_bootlogo = "disabled"

# GPU settings
pcsx_rearmed_gpu_neon_enhancement_enable = "disabled"
pcsx_rearmed_gpu_neon_enhancement_no_main = "disabled"

# ================================
# MAME 2003 Plus (Arcade)
# ================================
mame2003-plus_skip_disclaimer = "enabled"
mame2003-plus_skip_warnings = "enabled"
mame2003-plus_display_setup = "disabled"
mame2003-plus_frameskip = "0"
mame2003-plus_sample_rate = "48000"

# ================================
# FBNeo (Neo Geo / Arcade)
# ================================
fbneo-diagnostic-input = "Hold Start"
fbneo-neogeo-mode = "UNIBIOS"
fbneo-frameskip = "0"
fbneo-cpu-speed-adjust = "100"
fbneo-hiscores = "enabled"

# ================================
# Stella (Atari 2600)
# ================================
stella_console = "auto"
stella_filter = "disabled"
stella_ntsc_aspect = "par"
stella_crop_hoverscan = "enabled"

# ================================
# Flycast (Dreamcast)
# ================================
reicast_threaded_rendering = "enabled"
reicast_internal_resolution = "640x480"
reicast_screen_rotation = "horizontal"
reicast_gdrom_fast_loading = "disabled"

# ================================
# PPSSPP (PSP)
# ================================
ppsspp_internal_resolution = "960x544"
ppsspp_rendering_mode = "buffered"
ppsspp_frameskip = "0"
ppsspp_auto_frameskip = "disabled"
ppsspp_gpu_hardware_transform = "enabled"
ppsspp_vertex_cache = "enabled"
ppsspp_texture_filtering = "auto"
ppsspp_texture_scaling_level = "1"
