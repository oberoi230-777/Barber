desmume_pointer_device = "mouse"
desmume_pointer_type = "touch"
desmume_cpu_mode = "interpreter"
desmume_num_cores = "1"
desmume_screens_layout = "top/bottom"
desmume_screen_gap = "0"
desmume_firmware_language = "Auto"

# ================================
