# RetroArch Configuration - Portable USB Gaming Suite
# Optimized for 4K displays and USB drive operation

# ================================
# VIDEO SETTINGS
# ================================

# Video driver (d3d11 for Windows, best for 4K)
video_driver = "d3d11"

# Fullscreen settings
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_fullscreen_x = "0"
video_fullscreen_y = "0"

# Aspect ratio (core provided = original system ratio)
aspect_ratio_index = "22"
video_aspect_ratio_auto = "true"

# Scaling and filters
video_smooth = "true"
video_scale_integer = "false"
video_force_aspect = "true"

# Shader settings (CRT filters for authentic retro look)
video_shader_enable = "false"
video_shader_dir = "shaders"

# VSync (reduce screen tearing on modern displays)
video_vsync = "true"
video_swap_interval = "1"
video_max_swapchain_images = "3"

# Frame throttle
video_threaded = "true"
video_frame_delay = "0"

# 4K Display optimization
video_scale = "3.0"
video_viewport_custom_width = "3840"
video_viewport_custom_height = "2160"

# Bilinear filtering
video_filter = ""

# ================================
# AUDIO SETTINGS
# ================================

audio_driver = "wasapi"
audio_enable = "true"
audio_mute_enable = "false"
audio_out_rate = "48000"
audio_latency = "64"
audio_sync = "true"
audio_volume = "0.0"

# ================================
# INPUT SETTINGS
# ================================

# Input driver
input_driver = "dinput"
input_joypad_driver = "dinput"

# Auto-detect controllers
input_autodetect_enable = "true"
input_auto_game_focus = "2"

# Hotkeys (using keyboard + controller combos)
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "10"
input_pause_toggle = "p"
input_reset = "h"
input_screenshot = "f8"

# Fast forward
input_hold_fast_forward = "space"

# Save/Load states
input_save_state = "f2"
input_load_state = "f4"
input_state_slot_increase = "f6"
input_state_slot_decrease = "f5"

# Turbo
input_toggle_fast_forward = "backspace"

# Menu navigation
input_menu_toggle = "f1"

# Rewind
rewind_enable = "false"
rewind_granularity = "1"

# Controller settings for Player 1
input_player1_a_btn = "1"
input_player1_b_btn = "0"
input_player1_x_btn = "3"
input_player1_y_btn = "2"
input_player1_start_btn = "7"
input_player1_select_btn = "6"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_l2_btn = "6"
input_player1_r2_btn = "7"

# Analog sticks
input_player1_analog_dpad_mode = "1"

# ================================
# MENU SETTINGS
# ================================

# Menu driver (ozone = modern, clean interface)
menu_driver = "ozone"
ozone_menu_color_theme = "1"

# XMB settings (alternative menu)
menu_linear_filter = "true"
menu_horizontal_animation = "true"

# Menu wallpaper
menu_wallpaper = ""

# Show FPS
fps_show = "false"
framecount_show = "false"

# ================================
# DIRECTORY SETTINGS (Portable paths)
# ================================

# Core directories
libretro_directory = "cores"
libretro_info_path = "info"

# System files (BIOS)
system_directory = "system"

# Content
rgui_browser_directory = "..\\ROMs"
content_history_dir = "."

# Save files
savestate_directory = "..\\Save States"
savefile_directory = "..\\Save States"
savestate_auto_save = "true"
savestate_auto_load = "false"

# Assets
assets_directory = "assets"
rgui_config_directory = "config"
video_shader_dir = "shaders"
content_database_path = "database\\rdb"
cursor_directory = "database\\cursors"
cheat_database_path = "cheats"

# Playlists
playlist_directory = "playlists"

# Screenshots
screenshot_directory = "..\\Screenshots"

# Overlays
overlay_directory = "overlays"
input_overlay_enable = "false"

# Logs
log_dir = "logs"

# ================================
# CORE OPTIONS
# ================================

# Core info cache
core_info_cache_enable = "true"

# Content favorites
content_show_favorites = "true"
content_show_images = "true"
content_show_music = "true"
content_show_video = "true"

# History
content_history_size = "100"

# ================================
# PERFORMANCE
# ================================

# Run-ahead (reduce input lag)
run_ahead_enabled = "false"
run_ahead_frames = "1"
run_ahead_secondary_instance = "false"

# Frame delay (fine-tune input lag)
video_frame_delay = "0"

# Hard GPU sync
video_hard_sync = "false"
video_hard_sync_frames = "0"

# ================================
# NETPLAY (Multiplayer)
# ================================

netplay_enable = "false"
netplay_mode = "false"
netplay_ip_address = ""
netplay_delay_frames = "0"
netplay_nickname = "Player"
netplay_client_swap_input = "true"

# ================================
# MISC SETTINGS
# ================================

# Show advanced settings
menu_show_advanced_settings = "true"

# Configuration save on exit
config_save_on_exit = "true"

# Show hidden files
show_hidden_files = "false"

# Confirm quit
quit_press_twice = "true"

# Startup options
video_font_enable = "true"
video_font_size = "32"

# Display FPS
fps_show = "false"

# Pause when menu activated
pause_nonactive = "true"

# Game focus mode
input_auto_game_focus = "2"

# Disable composition (can improve performance)
video_disable_composition = "false"

# Notifications
video_font_enable = "true"
video_message_pos_x = "0.05"
video_message_pos_y = "0.05"

# ================================
# ACCESSIBILITY
# ================================

# On-screen notifications
video_font_size = "32"
video_message_bgcolor_enable = "true"
video_message_bgcolor_opacity = "0.75"

# Menu sounds
audio_enable_menu = "true"
audio_enable_menu_ok = "true"
audio_enable_menu_cancel = "true"
audio_enable_menu_notice = "true"

# Gamepad menu navigation
menu_navigation_wraparound_enable = "true"
menu_navigation_browser_filter_supported_extensions_enable = "true"

# ================================
# ACHIEVEMENT SETTINGS
# ================================

# RetroAchievements (optional - requires account)
cheevos_enable = "false"
cheevos_hardcore_mode_enable = "false"
cheevos_leaderboards_enable = "false"
cheevos_test_unofficial = "false"
cheevos_username = ""
cheevos_password = ""

# ================================
# THUMBNAIL SETTINGS
# ================================

# Thumbnail download
menu_content_show_favorites = "true"
menu_content_show_images = "true"
thumbnails_directory = "thumbnails"
menu_thumbnail_upscale_threshold = "0"

# ================================
# PRIVACY
# ================================

# Camera (disable for privacy)
camera_allow = "false"

# Location (disable for privacy)
location_allow = "false"

# Telemetry
bundle_assets_extract_enable = "true"
