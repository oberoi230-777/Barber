# RetroArch Configuration - Portable USB Gaming Suite v3.0
# Portable: all paths are relative so the USB drive letter can change freely.
# Applied automatically by SETUP / Configure-RetroArch. Safe to re-apply.
# Dual-player joystick support is first-class: P1 + P2 fully mapped.

# ================================
# VIDEO
# ================================
video_driver = "d3d11"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_fullscreen_x = "0"
video_fullscreen_y = "0"

# Use the core's native aspect ratio (4:3 for most retro systems).
aspect_ratio_index = "22"
video_aspect_ratio_auto = "true"
video_force_aspect = "true"
video_smooth = "true"
video_scale_integer = "false"

video_shader_enable = "false"
video_shader_dir = "shaders"

video_vsync = "true"
video_swap_interval = "1"
video_max_swapchain_images = "3"
video_threaded = "true"
video_frame_delay = "0"
video_hard_sync = "false"
video_hard_sync_frames = "0"
video_disable_composition = "false"

# ================================
# AUDIO
# ================================
audio_driver = "wasapi"
audio_enable = "true"
audio_mute_enable = "false"
audio_out_rate = "48000"
audio_latency = "64"
audio_sync = "true"
audio_volume = "0.0"
audio_enable_menu = "true"
audio_enable_menu_ok = "true"
audio_enable_menu_cancel = "true"
audio_enable_menu_notice = "true"

# ================================
# INPUT — multi-player joysticks
# ================================
input_driver = "dinput"
input_joypad_driver = "dinput"
input_autodetect_enable = "true"
input_auto_game_focus = "2"
input_max_users = "8"
input_remap_binds_enable = "true"
input_auto_analog_dpad_mode = "1"
input_axis_threshold = "0.25"

# Hotkeys (Select/Back enables hotkey combos on controllers).
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
input_menu_toggle = "f1"
input_menu_toggle_btn = "10"
input_pause_toggle = "p"
input_reset = "h"
input_screenshot = "f8"
input_hold_fast_forward = "space"
input_toggle_fast_forward = "backspace"
input_save_state = "f2"
input_load_state = "f4"
input_state_slot_increase = "f6"
input_state_slot_decrease = "f5"
input_player_p1_turbo = "nul"
input_toggle_fullscreen = "f11"
input_volume_up = "add"
input_volume_down = "subtract"
input_rewind = "r"
input_shader_next = "comma"
input_shader_prev = "period"
input_disk_eject_toggle = "e"
input_disk_next = "rbracket"
input_disk_prev = "lbracket"
input_grab_mouse_toggle = "f9"
input_desktop_menu_toggle = "f10"
input_netplay_game_watch = "i"
input_send_debug_info = "nul"
input_fps_toggle = "f3"
input_ai_service = "nul"

rewind_enable = "true"
rewind_granularity = "2"
rewind_buffer_size = "20"

