# Xbox Controller Profile
# Works with Xbox One, Xbox Series X|S, Xbox 360 controllers

input_driver = "dinput"
input_device = "Xbox Controller"
input_device_display_name = "Xbox Controller"

# D-Pad
input_up_axis = "-1"
input_down_axis = "+1"
input_left_axis = "-0"
input_right_axis = "+0"

# Face buttons (A, B, X, Y)
input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "2"
input_y_btn = "3"

# Shoulder buttons
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"

# Start/Select (Menu/View)
input_start_btn = "7"
input_select_btn = "6"

# Analog sticks (click)
input_l3_btn = "8"
input_r3_btn = "9"

# Left analog stick
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"

# Right analog stick
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"

# Hotkey button (Select/View for hotkey mode)
input_enable_hotkey_btn = "6"

# Menu toggle (Guide button if available)
input_menu_toggle_btn = "10"
