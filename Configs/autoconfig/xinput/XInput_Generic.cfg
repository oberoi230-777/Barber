# Generic XInput Controller Profile
# Covers Xbox One/Series, 8BitDo (X mode), PS controllers via DS4Windows,
# and most modern Windows gamepads when RetroArch uses the xinput joypad driver.
# RetroArch ships its own database too; this file guarantees sane hotkeys.

input_driver = "xinput"
input_device = "XInput Controller"
input_device_display_name = "XInput Gamepad"

# D-Pad
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

# Face buttons
input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "2"
input_y_btn = "3"

# Shoulders + triggers
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"

# View/Back + Menu/Start
input_select_btn = "8"
input_start_btn = "9"

# Stick clicks
input_l3_btn = "10"
input_r3_btn = "11"

# Left analog stick
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"

# Right analog stick
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"

# Hotkeys: hold View/Back + press another button.
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "10"
input_save_state_btn = "4"
input_load_state_btn = "5"
