# PlayStation 4 / PlayStation 5 Controller Profile (DirectInput driver)
# DualShock 4 / DualSense over USB. For Bluetooth, DS4Windows (XInput mode)
# is recommended - see Configs/autoconfig/xinput/.

input_driver = "dinput"
input_device = "PS4 Controller"
input_device_display_name = "PlayStation Controller"

# D-Pad (hat)
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

# Face buttons (Cross, Circle, Square, Triangle)
input_a_btn = "1"      # Cross
input_b_btn = "2"      # Circle
input_x_btn = "0"      # Square
input_y_btn = "3"      # Triangle

# Shoulder buttons
input_l_btn = "4"      # L1
input_r_btn = "5"      # R1

# Triggers are buttons on Windows DirectInput for the DS4.
input_l2_btn = "6"     # L2
input_r2_btn = "7"     # R2

# Share/Create and Options
input_select_btn = "8"
input_start_btn = "9"

# Analog stick clicks
input_l3_btn = "10"
input_r3_btn = "11"

# Left analog stick
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"

# Right analog stick
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"

# Hotkeys: hold Share + press another button.
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "12"
