# Nintendo Switch Pro Controller Profile (DirectInput driver)
# Works over USB and Bluetooth (pair in Windows Bluetooth settings first).
# NOTE: Switch face buttons are swapped vs Xbox layout (A/B and X/Y);
# this mapping follows the physical position (Nintendo layout).

input_driver = "dinput"
input_device = "Pro Controller"
input_device_display_name = "Switch Pro Controller"

# D-Pad
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

# Face buttons (Nintendo layout positions)
input_a_btn = "1"      # B position (right)
input_b_btn = "0"      # A position (bottom)
input_x_btn = "3"      # Y position (left)
input_y_btn = "2"      # X position (top)

# Shoulders + triggers
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"

# Minus (-) and Plus (+)
input_select_btn = "8"
input_start_btn = "9"

# Stick clicks
input_l3_btn = "10"
input_r3_btn = "11"

# Left analog stick
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"

# Right analog stick
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"

# Hotkeys: hold Minus + press another button.
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "12"
