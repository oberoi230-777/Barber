# Xbox Controller Profile (DirectInput driver)
# Works with Xbox One, Xbox Series X|S, Xbox 360 controllers over USB/Bluetooth.
# NOTE: each button index must be unique - Start/Back must NOT share
# indexes with the triggers (fixed in v2.0).

input_driver = "dinput"
input_device = "Xbox Controller"
input_device_display_name = "Xbox Controller"

# D-Pad (axes on most dinput Xbox mappings)
input_up_axis = "-1"
input_down_axis = "+1"
input_left_axis = "-0"
input_right_axis = "+0"

# Face buttons (A, B, X, Y)
input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "2"
input_y_btn = "3"

# Shoulder buttons
input_l_btn = "4"
input_r_btn = "5"

# Triggers share a combined Z axis on dinput - do NOT reuse 6/7 here,
# those are Back/Start (see below).
input_l2_axis = "+2"
input_r2_axis = "-2"

# Back/Select (View) and Start (Menu)
input_select_btn = "6"
input_start_btn = "7"

# Analog stick clicks
input_l3_btn = "8"
input_r3_btn = "9"

# Left analog stick
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"

# Right analog stick
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"

# Hotkeys: hold Back(View) + press another button.
input_enable_hotkey_btn = "6"
input_exit_emulator_btn = "7"
input_menu_toggle_btn = "8"
